# Ein Tag `<paket>-v<n>` (z. B. practice-origin-v2) baut das Linux-Binary dieses Pakets und
# hängt es als `<paket>-linux-x64` an ein Release mit demselben Namen. cloud-init auf den
# Droplets lädt genau diese Datei ohne Anmeldung.
#
# Actions sind auf Commit-SHAs gepinnt: dieser Workflow hat Schreibrechte und baut Binaries,
# die auf den Droplets laufen.
name: Release

on:
  push:
    tags:
      - 'practice-origin-v*'
      - 'attack-runner-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.pkg.outputs.name }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Paket aus dem Tag bestimmen
        id: pkg
        run: echo "name=${TAG%-v*}" >> "$GITHUB_OUTPUT"
      - name: Prüfen und testen
        working-directory: ${{ steps.pkg.outputs.name }}
        run: |
          bun run check
          bun test
      - name: Linux-Binary bauen
        working-directory: ${{ steps.pkg.outputs.name }}
        run: bun run build:linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary
          path: ${{ steps.pkg.outputs.name }}/dist/${{ steps.pkg.outputs.name }}-linux-x64
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binary
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PKG: ${{ needs.build.outputs.pkg }}
        run: gh release create "$TAG" "$PKG-linux-x64" --title "$TAG" --generate-notes
